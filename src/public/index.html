<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="theme-color" content="#1d2a33">
        <title>Panopticum – kontroler</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="/socket.io/socket.io.js"></script>
        <script type="module" src="controller.js"></script>
    </head>

    <body class="controller">

        <!-- Dołączanie do pokoju -->
        <div id="join-screen" class="panel">
            <h1>Dołącz do gry</h1>

            <label for="player-name">Twoja nazwa:</label>
            <input type="text" id="player-name" maxlength="24" autocomplete="off" placeholder="np. Tomasz">

            <div class="room-header">
                <p class="p-label">Pokoje:</p>
                <button class="small secondary" id="btn-refresh" title="Odśwież listę pokoi">⟳ Odśwież</button>
            </div>
            <div id="room-list"><p class="muted">Szukam pokoi…</p></div>

            <label for="room-name">Nazwa pokoju:</label>
            <input type="text" id="room-name" maxlength="64" autocomplete="off" placeholder="Wybierz z listy lub wpisz">

            <label for="room-password">Hasło (jeśli pokój ma hasło):</label>
            <input type="password" id="room-password" maxlength="32" autocomplete="off">

            <div class="buttons">
                <button id="btn-join">Dołącz</button>
            </div>
            <div id="join-error" class="error"></div>

            <nav class="footer-links">
                <a class="link-card" href="host.html">
                    <span class="link-icon" aria-hidden="true">🖥️</span>
                    <span class="link-text">
                        <strong>Ekran hosta</strong>
                        <small>Utwórz pokój</small>
                    </span>
                </a>
                <a class="link-card" href="https://github.com/SigmaZPolic2137/PraktykiPanopticum" target="_blank" rel="noopener">
                    <svg class="link-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                    <span class="link-text">
                        <strong>Kod źródłowy</strong>
                        <small>Projekt na GitHubie</small>
                    </span>
                </a>
            </nav>
        </div>

        <!-- Kontroler -->
        <div id="controller-screen" class="hidden">
            <div id="controller-top">
                <span class="dot" id="my-color"></span>
                <span class="name" id="my-name"></span>
                <button class="small ready-button hidden" id="btn-ready">Nie gotowy</button>
                <button class="small secondary" id="btn-leave">Wyjdź</button>
            </div>
            <div id="controller-status">Czekam, aż host rozpocznie grę…</div>
            <div id="pad" class="disabled">
                <span class="arrow" id="pad-arrow">⬆</span>
                <span id="pad-label">TRZYMAJ</span>
            </div>
        </div>
    </body>
</html>
