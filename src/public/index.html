<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="theme-color" content="#1d2a33">
        <title>Panopticum – kontroler</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="/socket.io/socket.io.js"></script>
        <script type="module" src="controller.js"></script>
    </head>

    <body class="controller">

        <!-- Dołączanie do pokoju -->
        <div id="join-screen" class="panel">
            <h1>Dołącz do gry</h1>

            <label for="player-name">Twoja nazwa:</label>
            <input type="text" id="player-name" maxlength="24" autocomplete="off" placeholder="np. Tomasz">

            <p class="p-label">Pokoje:</p>
            <div id="room-list"><p class="muted">Szukam pokoi…</p></div>

            <label for="room-name">Nazwa pokoju:</label>
            <input type="text" id="room-name" maxlength="64" autocomplete="off" placeholder="Wybierz z listy lub wpisz">

            <label for="room-password">Hasło (jeśli pokój ma hasło):</label>
            <input type="password" id="room-password" maxlength="32" autocomplete="off">

            <div class="buttons">
                <button id="btn-join">Dołącz</button>
            </div>
            <div id="join-error" class="error"></div>

            <p class="muted">Ekran hosta z grą to <a href="host.html">host.html</a>.</p>
            <p class="muted">Kod źródłowy to <a href="https://github.com/SigmaZPolic2137/PraktykiPanopticum">GitHub</a>.</p>
        </div>

        <!-- Kontroler -->
        <div id="controller-screen" class="hidden">
            <div id="controller-top">
                <span class="dot" id="my-color"></span>
                <span class="name" id="my-name"></span>
                <button class="small secondary" id="btn-leave">Wyjdź</button>
            </div>
            <div id="controller-status">Czekam, aż host rozpocznie grę…</div>
            <div id="pad" class="disabled">
                <span class="arrow">⬆</span>
                <span>TRZYMAJ</span>
            </div>
        </div>
    </body>
</html>
