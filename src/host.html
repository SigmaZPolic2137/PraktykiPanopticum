<!DOCTYPE html>
<html lang="pl-PL">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Panel hosta</title>
	</head>
	<body>
		<h1>Witaj na panelu hosta</h1>

		<h2>Połączone urządzenia:</h2>
		<p id="connected-count">Ilość: 0</p>
		<div id="device-list"></div>

		<h2>Wyślij wiadomość:</h2>
		<input id="typed-message" type="text" placeholder="Type message here...">
		<button id="send-message-button" onclick="SendMessage()">Wyślij</button>

		<script src="/socket.io/socket.io.js"></script>
    	<script>
        	const Socket = io();

			const DeviceList = document.getElementById("device-list");
			const ConnectedCount = document.getElementById("connected-count");
			const TypedMessage = document.getElementById("typed-message");

			Socket.on("connect", () => {
				Socket.emit("registerAsHost");
			});

			Socket.on("hostDataUpdate", (Data) => {
				ConnectedCount.textContent = "Ilość: " + Data.Count;
				
				DeviceList.innerHTML = "";
				Data.Devices.forEach(id => {
					const Node = document.createElement("p");
					Node.textContent = id;
					DeviceList.append(Node);
				});
			});

			function SendMessage() {
				if (TypedMessage.value?.trim()) {
					Socket.emit("sendMessage", { Message: TypedMessage.value });
					TypedMessage.value = "";
				}
			}
    	</script>
	</body>
</html>
